name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # The Go code embeds web/dist, so it is built first.
  go:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: The headless binary starts and serves the UI
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$(tr -d '[:space:]' < VERSION)" -o nimbo-linux-amd64 .
          NIMBO_DATA_DIR=$(mktemp -d) ./nimbo-linux-amd64 serve --port 18080 &
          for i in $(seq 1 30); do curl -sf localhost:18080/api/health && break; sleep 1; done
          curl -sf localhost:18080/ | grep -q "<title>Nimbo</title>"
          curl -sf localhost:18080/api/labs | grep -q first-bucket
          kill %1

  desktop:
    runs-on: windows-2022
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build the app
        shell: bash
        run: wails build -s -platform windows/amd64 -ldflags "-X main.version=$(tr -d '[:space:]' < VERSION)" -o Nimbo.exe
      - name: The portable app runs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Nimbo | Out-Null
          Copy-Item build/bin/Nimbo.exe, LICENSE dist/Nimbo/
          Compress-Archive -Path dist/Nimbo -DestinationPath dist/Nimbo-ci-windows-x64.zip
          powershell -NoProfile -File packaging/smoke-test.ps1 -Zip dist/Nimbo-ci-windows-x64.zip
          exit $LASTEXITCODE
      - name: The installer builds
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          powershell -NoProfile -File packaging/build-msi.ps1 -Version $v -Exe build/bin/Nimbo.exe -Out dist/Nimbo.msi
          exit $LASTEXITCODE
