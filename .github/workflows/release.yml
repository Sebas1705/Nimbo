name: Release

# A tag like v0.1.0 builds the jar, publishes a GitHub release and pushes the image to GHCR.
# Running it by hand (Actions > Release > Run workflow) only builds and tests everything and keeps the
# result as a workflow artifact: nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          DECLARED=$(sed -n 's/.*?: "\([0-9][^"]*\)".*/\1/p' backend/build.gradle.kts | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$DECLARED" ]]; then
              echo "::error::The tag says $VERSION but backend/build.gradle.kts declares $DECLARED. Bump it and tag again."
              exit 1
            fi
          else
            VERSION="$DECLARED"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging Nimbo $VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Backend tests and jar
        run: ./gradlew --console=plain -PnimboVersion=${{ steps.version.outputs.version }} :backend:test :backend:buildFatJar

      - name: Collect the jar
        run: |
          mkdir dist
          cp backend/build/libs/nimbo-${{ steps.version.outputs.version }}.jar dist/
          (cd dist && sha256sum nimbo-*.jar)

      - name: The jar starts and serves the UI
        run: |
          java -jar dist/nimbo-${{ steps.version.outputs.version }}.jar &
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf localhost:8080/api/health | grep -q '"version":"${{ steps.version.outputs.version }}"'
          curl -sf localhost:8080/ | grep -q '<title>Nimbo</title>'
          curl -sf localhost:8080/api/labs | grep -q first-bucket
          kill %1

      - name: The image builds
        run: docker build --build-arg NIMBO_VERSION=${{ steps.version.outputs.version }} -t nimbo:ci .

      - uses: actions/upload-artifact@v4
        with:
          name: nimbo-${{ steps.version.outputs.version }}
          path: dist/

  desktop:
    needs: package
    # Pinned: jpackage in JDK 21 needs WiX 3, which this image ships.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Portable app (zip)
        shell: bash
        run: ./gradlew --console=plain -PnimboVersion=${{ needs.package.outputs.version }} :backend:zipDesktop

      - name: The portable app runs
        run: powershell -NoProfile -File packaging/smoke-test.ps1 -Zip backend/build/distributions/Nimbo-${{ needs.package.outputs.version }}-windows-x64.zip

      - name: WiX
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $dir = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dir) {
              choco install wixtoolset --no-progress -y
              $dir = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset*" -Directory | Select-Object -First 1
            }
            "$($dir.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            Write-Host "WiX: $($dir.FullName)"
          }

      - name: Installer (msi)
        shell: bash
        run: ./gradlew --console=plain -PnimboVersion=${{ needs.package.outputs.version }} -PdesktopType=msi :backend:packageDesktop

      - name: Collect
        shell: bash
        run: |
          V=${{ needs.package.outputs.version }}
          mkdir dist
          cp backend/build/distributions/Nimbo-$V-windows-x64.zip dist/
          cp backend/build/desktop/Nimbo-$V.msi dist/Nimbo-$V-windows-x64.msi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: nimbo-desktop-${{ needs.package.outputs.version }}
          path: dist/

  # The emulator images, saved as files so Nimbo can run with no internet (Sistema > Sin conexión loads them).
  # Which image goes in which pack is backend/src/main/resources/image-packs.json, and a test keeps it in step with the catalog.
  images:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save the image packs
        run: |
          V=${{ needs.package.outputs.version }}
          mkdir dist
          for pack in $(jq -r '.packs[].id' backend/src/main/resources/image-packs.json); do
            IMAGES=$(jq -r --arg p "$pack" '.packs[] | select(.id==$p) | .images[]' backend/src/main/resources/image-packs.json)
            for image in $IMAGES; do docker pull --quiet "$image"; done
            docker save $IMAGES | gzip -6 > "dist/Nimbo-$V-images-$pack.tar.gz"
            SIZE=$(stat -c %s "dist/Nimbo-$V-images-$pack.tar.gz")
            echo "$pack: $((SIZE / 1048576)) MiB"
            # A GitHub release asset can be at most 2 GiB: fail loudly instead of publishing half a release.
            if [ "$SIZE" -gt 2040109465 ]; then echo "::error::Pack $pack is too big for a release asset: split it in image-packs.json"; exit 1; fi
            docker image rm $IMAGES > /dev/null 2>&1 || true
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: nimbo-images-${{ needs.package.outputs.version }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nimbo-*
          merge-multiple: true
          path: dist
      - name: Checksums of everything that is published
        run: |
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          # 0.x means the API and the file formats may still change.
          [[ "${{ needs.package.outputs.version }}" == 0.* ]] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Nimbo ${{ needs.package.outputs.version }}" \
            --notes-file <(awk '/^## \['"${{ needs.package.outputs.version }}"'\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md) \
            --verify-tag $FLAGS

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nimbo" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NIMBO_VERSION=${{ needs.package.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.package.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
