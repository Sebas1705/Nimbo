id: dynamodb-basics
level: 2
stack: aws-basic
title:
  en: DynamoDB basics
  es: Fundamentos de DynamoDB
summary:
  en: Model a key-value table with a partition key and store a few orders.
  es: Modela una tabla clave-valor con clave de partición y guarda algunos pedidos.
steps:
  - en: Create an on-demand table named lab-orders whose partition key is the string attribute id.
    es: Crea una tabla bajo demanda llamada lab-orders cuya clave de partición sea el atributo de texto id.
  - en: Put at least three items, each with an id and a numeric total.
    es: Inserta al menos tres elementos, cada uno con un id y un total numérico.
  - en: Verify, then read one item back by key.
    es: Verifica y lee después un elemento por su clave.
hints:
  - en: DynamoDB attributes are typed on the wire ({"S":"1"}, {"N":"42"}); the Inspector shows them as plain JSON.
    es: Los atributos de DynamoDB llevan tipo en el cable ({"S":"1"}, {"N":"42"}); el Inspector los muestra como JSON normal.
solution:
  - title:
      en: AWS CLI
      es: AWS CLI
    code: |
      E="--endpoint-url http://localhost:4566"
      aws $E dynamodb create-table --table-name lab-orders --billing-mode PAY_PER_REQUEST \
        --key-schema AttributeName=id,KeyType=HASH --attribute-definitions AttributeName=id,AttributeType=S
      for i in 1 2 3; do
        aws $E dynamodb put-item --table-name lab-orders --item "{\"id\":{\"S\":\"$i\"},\"total\":{\"N\":\"$((i*10))\"}}"
      done
      aws $E dynamodb get-item --table-name lab-orders --key '{"id":{"S":"1"}}'
checks:
  - type: dynamodb.table
    name: lab-orders
    key: id
    label:
      en: Table lab-orders exists with partition key id
      es: Existe la tabla lab-orders con clave de partición id
  - type: dynamodb.items
    table: lab-orders
    atLeast: 3
    attribute: total
    label:
      en: At least 3 items have a total
      es: Al menos 3 elementos tienen un total
